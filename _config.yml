title: "Sh1zok's Articles"
description: "Субдомен сайта Sh1zok для статей."
author_name: "Sh1zok"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-sitemap
  - jekyll-toc

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - .github/
  - README.md

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      permalink: "/:categories/:title/"
